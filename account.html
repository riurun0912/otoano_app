<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>アカウント - Otoano</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .account-wrap { max-width: 860px; margin: 40px auto; padding: 0 20px 80px; display: grid; gap: 24px; }

    .profile-card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 32px; display: flex; gap: 32px; align-items: flex-start; }
    .avatar-wrap { position: relative; flex-shrink: 0; }
    .avatar-circle { width: 88px; height: 88px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #b46bff); display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 800; color: #fff; }
    .avatar-edit { position: absolute; bottom: 0; right: 0; width: 28px; height: 28px; background: var(--line); border: 2px solid var(--panel); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; color: var(--muted); transition: background 0.2s; }
    .avatar-edit:hover { background: var(--accent); color: #08111f; }

    .profile-meta { flex: 1; }
    .profile-meta h1 { margin: 0 0 4px; font-size: 22px; color: #fff; }
    .profile-meta .handle { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
    .profile-meta .bio { font-size: 14px; color: #d6def0; line-height: 1.6; margin: 0; }

    .profile-stats { display: flex; gap: 24px; flex-shrink: 0; }
    .stat-item { text-align: center; }
    .stat-num { font-size: 24px; font-weight: 800; color: var(--accent); line-height: 1; }
    .stat-label { font-size: 11px; color: var(--muted); margin-top: 4px; }

    .settings-card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
    .settings-card-head { padding: 18px 28px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
    .settings-card-head h2 { margin: 0; font-size: 15px; color: #fff; font-weight: 700; }
    .settings-card-body { padding: 28px; display: grid; gap: 20px; }

    .field { display: grid; gap: 6px; }
    .field label { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; }
    .field input, .field textarea, .field select {
      background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
      color: #fff; padding: 10px 14px; font-size: 14px; font-family: inherit;
      transition: border-color 0.2s; width: 100%;
    }
    .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
    .field textarea { resize: vertical; min-height: 80px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .save-row { display: flex; justify-content: flex-end; padding-top: 8px; border-top: 1px solid var(--line); }
    .btn-danger { background: transparent; border: 1px solid #ff6b6b; color: #ff6b6b; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; transition: background 0.2s; }
    .btn-danger:hover { background: rgba(255,107,107,0.1); }

    .danger-zone { border-color: rgba(255,107,107,0.3); }
    .danger-zone .settings-card-head { border-bottom-color: rgba(255,107,107,0.2); }
    .danger-zone .settings-card-head h2 { color: #ff8e8e; }

    @media (max-width: 640px) {
      .profile-card { flex-direction: column; gap: 20px; }
      .profile-stats { gap: 16px; }
      .field-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<header>
  <button class="nav-btn" id="navBtn" aria-label="メニューを開く"><span></span><span></span><span></span></button>
  <a href="index.html" class="site-logo">Otoano</a>
  <span class="header-page-label">アカウント</span>
  <div style="flex:1"></div>
</header>

<div class="account-wrap">

  <!-- プロフィールカード -->
  <div class="profile-card">
    <div class="avatar-wrap">
      <div class="avatar-circle">ユ</div>
      <div class="avatar-edit" title="アイコンを変更">✏</div>
    </div>
    <div class="profile-meta">
      <h1>ユーザー A</h1>
      <div class="handle">@user_a</div>
      <p class="bio">マルチエフェクター使いのギタリスト。初心者〜中級向けの楽曲を中心に投稿しています。</p>
    </div>
    <div class="profile-stats">
      <div class="stat-item">
        <div class="stat-num">3</div>
        <div class="stat-label">投稿数</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">4.8</div>
        <div class="stat-label">平均評価</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">24</div>
        <div class="stat-label">プレイ数</div>
      </div>
    </div>
  </div>

  <!-- プロフィール設定 -->
  <div class="settings-card">
    <div class="settings-card-head">
      <h2>プロフィール設定</h2>
    </div>
    <div class="settings-card-body">
      <div class="field-row">
        <div class="field">
          <label>表示名</label>
          <input type="text" value="ユーザー A" />
        </div>
        <div class="field">
          <label>ユーザーID</label>
          <input type="text" value="user_a" />
        </div>
      </div>
      <div class="field">
        <label>自己紹介</label>
        <textarea>マルチエフェクター使いのギタリスト。初心者〜中級向けの楽曲を中心に投稿しています。</textarea>
      </div>
      <div class="field">
        <label>使用機材（メイン）</label>
        <select>
          <option>マルチエフェクター</option>
          <option>ストラトタイプ</option>
          <option>レスポールタイプ</option>
          <option>真空管アンプ</option>
        </select>
      </div>
      <div class="save-row">
        <button class="btn-primary" onclick="alert('保存しました')">保存する</button>
      </div>
    </div>
  </div>

  <!-- アカウント設定 -->
  <div class="settings-card">
    <div class="settings-card-head">
      <h2>アカウント設定</h2>
    </div>
    <div class="settings-card-body">
      <div class="field">
        <label>メールアドレス</label>
        <input type="email" value="user@example.com" />
      </div>
      <div class="field-row">
        <div class="field">
          <label>新しいパスワード</label>
          <input type="password" placeholder="8文字以上" />
        </div>
        <div class="field">
          <label>パスワード（確認）</label>
          <input type="password" placeholder="もう一度入力" />
        </div>
      </div>
      <div class="save-row">
        <button class="btn-primary" onclick="alert('変更しました')">変更する</button>
      </div>
    </div>
  </div>

  <!-- 危険ゾーン -->
  <div class="settings-card danger-zone">
    <div class="settings-card-head">
      <h2>アカウントの削除</h2>
    </div>
    <div class="settings-card-body">
      <p style="font-size:14px; color:var(--muted); margin:0 0 16px;">アカウントを削除すると、投稿したすべてのアノテーションとプレイ履歴が完全に削除されます。この操作は元に戻せません。</p>
      <button class="btn-danger" onclick="alert('この機能は現在利用できません')">アカウントを削除する</button>
    </div>
  </div>

</div>

<div class="nav-overlay" id="navOverlay"></div>
<nav class="nav-panel" id="navPanel">
  <div class="nav-panel-head">
    <a href="index.html" class="nav-panel-logo">Otoano</a>
    <button class="nav-panel-close" id="navClose">✕</button>
  </div>
  <div class="nav-panel-section">
    <div class="nav-panel-label">メイン</div>
    <a href="index.html">ホーム</a>
    <a href="search.html">横断検索</a><a href="upload.html">アノテーション投稿</a>
  </div>
  <div class="nav-panel-section">
    <div class="nav-panel-label">ガイド</div>
    <a href="usage-guide.html">サイト利用ガイド</a>
    <a href="guide.html">エレキギター初心者ガイド</a>
    <a href="band-guide.html">バンド活動ガイド</a>
  </div>
  <div class="nav-panel-section">
    <div class="nav-panel-label">辞書</div>
    <a href="terms.html">奏法・機材解説</a>
  </div>
  <div class="nav-panel-section">
    <div class="nav-panel-label">ユーザー情報</div>
    <a href="account.html" class="nav-current">アカウント</a>
    <a href="history.html" class="nav-mypage-link">プレイ履歴</a>
    <a href="posts.html" class="nav-mypage-link">投稿管理</a>
  </div>
</nav>
<script>
(function(){
  var btn=document.getElementById('navBtn'),ov=document.getElementById('navOverlay'),pn=document.getElementById('navPanel'),cl=document.getElementById('navClose');
  function open(){ov.classList.add('open');pn.classList.add('open');}
  function close(){ov.classList.remove('open');pn.classList.remove('open');}
  if(btn)btn.addEventListener('click',open);
  if(cl)cl.addEventListener('click',close);
  if(ov)ov.addEventListener('click',close);
})();
</script>
</body>
</html>
